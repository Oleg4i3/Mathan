<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз: комплексні числа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --panel-border: rgba(20,27,42,0.14);
    --grid: rgba(20,27,42,0.06);
    --ink: #171E2C;
    --dim: #5B6472;
    --gold: #93711A;
    --teal: #0E7C72;
    --good: #1F7A3D;
    --bad: #AE3A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0F1A;
      --panel: #111827;
      --panel-border: rgba(255,255,255,0.10);
      --grid: rgba(148,163,184,0.09);
      --ink: #E7EAF0;
      --dim: #8B95A8;
      --gold: #D9B84E;
      --teal: #5FD8CB;
      --good: #63C783;
      --bad: #E5766C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0F1A;
    --panel: #111827;
    --panel-border: rgba(255,255,255,0.10);
    --grid: rgba(148,163,184,0.09);
    --ink: #E7EAF0;
    --dim: #8B95A8;
    --gold: #D9B84E;
    --teal: #5FD8CB;
    --good: #63C783;
    --bad: #E5766C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    line-height: 1.5;
    min-height: 100vh;
    padding: 48px 20px 90px;
  }
  .page { max-width: 640px; margin: 0 auto; }

  /* floating stopwatch */
  #stopwatch {
    position: fixed;
    top: 18px;
    right: 18px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    padding: 8px 12px 10px;
    opacity: 0.6;
    z-index: 50;
    transition: opacity 0.15s ease;
    pointer-events: none;
    min-width: 96px;
  }
  #stopwatch:hover { opacity: 0.9; }
  #stopwatch .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--teal);
    border-radius: 50%;
    margin-right: 7px;
  }
  #stopwatch .sw-progress-track {
    height: 2px;
    background: var(--panel-border);
    margin-top: 7px;
  }
  #stopwatch .sw-progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  header { margin-bottom: 40px; }
  .plane { width: 76px; height: 76px; display: block; margin-bottom: 18px; }
  .plane line { stroke: var(--dim); stroke-width: 1; }
  .plane .vec { stroke: var(--teal); stroke-width: 2; }
  .plane .arc { stroke: var(--gold); stroke-width: 1.4; fill: none; }
  .plane circle { fill: var(--gold); }

  h1 {
    font-family: 'Spectral', Georgia, serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  .subtitle { color: var(--dim); font-size: 0.92rem; max-width: 48ch; margin: 0; }

  .progress-track { height: 3px; background: var(--panel-border); margin: 30px 0 0; }
  .progress-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.25s ease; }
  .progress-label { font-size: 0.78rem; color: var(--dim); margin: 8px 0 34px; }
  #startBtn {
    background: var(--teal);
    color: var(--bg);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 14px 22px;
    cursor: pointer;
    margin-top: 30px;
  }
  #startBtn:hover { filter: brightness(1.08); }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #quiz.locked { display: none; }

  .q { border-top: 1px solid var(--panel-border); padding: 26px 0; }
  .q:last-of-type { border-bottom: 1px solid var(--panel-border); }
  .q-num { font-size: 0.78rem; color: var(--dim); margin-bottom: 10px; }
  .q-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.12rem; margin: 0 0 16px; max-width: 58ch; }
  .q-prompt b { font-weight: 600; }

  .answer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .answer-row input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    padding: 10px 12px;
    width: 220px;
    max-width: 100%;
  }
  .answer-row input[type="text"]:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .hint-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    padding: 9px 12px;
    cursor: pointer;
  }
  .hint-btn:hover { border-color: var(--gold); }
  .hint-btn:disabled { cursor: default; opacity: 0.55; }

  .hint-text {
    display: none;
    margin-top: 12px;
    font-size: 0.86rem;
    color: var(--dim);
    border-left: 2px solid var(--gold);
    padding-left: 12px;
  }
  .hint-text.shown { display: block; }

  .actions { margin-top: 46px; display: flex; justify-content: flex-start; }
  #submitBtn, #retryBtn {
    background: var(--teal);
    color: var(--bg);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 14px 22px;
    cursor: pointer;
  }
  #submitBtn:hover, #retryBtn:hover { filter: brightness(1.08); }

  #results { display: none; }
  .score-block {
    border-top: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 28px 0;
    margin: 40px 0 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }
  .score-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 2.6rem; }
  .score-num span { color: var(--dim); font-size: 1.4rem; }
  .time-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 1.6rem; text-align: right; }
  .time-lbl, .score-note { color: var(--dim); font-size: 0.8rem; }

  .review { border-top: 1px solid var(--panel-border); padding: 20px 0; }
  .review:last-child { border-bottom: 1px solid var(--panel-border); }
  .review-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 0.78rem; color: var(--dim); }
  .verdict { font-weight: 600; }
  .verdict.correct { color: var(--good); }
  .verdict.wrong { color: var(--bad); }
  .verdict.partial { color: var(--gold); }
  .review-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.03rem; margin: 10px 0 12px; }
  .review-line { font-size: 0.88rem; margin: 4px 0; }
  .review-line .lbl { color: var(--dim); }
  .your-ans.wrong { color: var(--bad); }
  .your-ans.correct { color: var(--good); }
  .review-explain { margin-top: 10px; font-size: 0.86rem; color: var(--dim); padding: 10px 12px; background: var(--panel); border: 1px solid var(--panel-border); }

  @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
</style>
</head>
<body>

<div id="stopwatch"><span class="dot"></span><span id="timeDisplay">00:00</span><div class="sw-progress-track"><div class="sw-progress-fill" id="swProgressFill"></div></div></div>

<div class="page">

  <header>
    <svg class="plane" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
      <line x1="6" y1="66" x2="70" y2="66"></line>
      <line x1="10" y1="70" x2="10" y2="6"></line>
      <path class="arc" d="M 30 66 A 20 20 0 0 0 24.1 51.9"></path>
      <line class="vec" x1="10" y1="66" x2="46" y2="30"></line>
      <circle cx="46" cy="30" r="2.6"></circle>
    </svg>
    <h1>Комплексні числа</h1>
    <p class="subtitle">20 задач: модуль, аргумент, добуток, частка, степінь, форми запису та корені комплексних рівнянь.</p>
    <button id="startBtn">Старт</button>
  </header>

  <div id="quiz" class="locked"></div>

  <div class="actions"><button id="submitBtn">Завершити тест</button></div>

  <div id="results">
    <div class="score-block">
      <div>
        <div class="score-num" id="scoreNum">0<span> / 20</span></div>
        <p class="score-note" id="scoreNote"></p>
      </div>
      <div>
        <div class="time-num" id="finalTime">00:00</div>
        <p class="time-lbl">витрачений час</p>
      </div>
    </div>
    <div id="reviewList"></div>
    <div class="actions"><button id="retryBtn">Пройти ще раз</button></div>
  </div>

</div>

<script>
const questions = [
  {
    type: 'num',
    prompt: "Дано <b>z = 6 + 8i</b>. Знайдіть модуль спряженого числа z̄, тобто |z̄|.",
    hint: "z̄ відрізняється лише знаком уявної частини; це не впливає на суму квадратів дійсної та уявної частин.",
    expected: 10, tol: 0.01,
    display: "10",
    explain: "z̄ = 6 − 8i, і |z̄| = √(6²+8²) = √100 = 10 — той самий модуль, що й у z, оскільки |z̄| = |z| завжди."
  },
  {
    type: 'num',
    prompt: "Дано <b>z = 5 − 12i</b>. Знайдіть |z|.",
    hint: "5, 12, 13 — піфагорова трійка.",
    expected: 13, tol: 0.01,
    display: "13",
    explain: "|z| = √(5²+12²) = √169 = 13."
  },
  {
    type: 'num',
    prompt: "Дано <b>z = √3 + i</b>. Знайдіть arg(z) у градусах.",
    hint: "tan(θ) = 1/√3, z у першій чверті.",
    expected: 30, tol: 0.5,
    display: "30°",
    explain: "tan(θ) = 1/√3 ⇒ θ = 30°, і точка справді лежить у першій чверті."
  },
  {
    type: 'num',
    prompt: "Комплексне число z дорівнює своєму спряженому, z = z̄. Чому дорівнює <b>додатний</b> (тобто більший за нуль) аргумент такого числа, у градусах?",
    hint: "З рівності z = z̄ випливає, що z — дійсне число. У дійсного числа можливі лише два значення аргументу: 0° або 180°.",
    expected: 180, tol: 0.5,
    display: "180°",
    explain: "z = z̄ означає, що уявна частина z дорівнює нулю, тобто z — дійсне число. Аргумент дійсного додатного числа дорівнює 0°, а від'ємного — 180°. Оскільки 0° не є додатним значенням, єдиний можливий додатний аргумент — 180° (він відповідає від'ємним дійсним числам)."
  },
  {
    type: 'num',
    prompt: "Дано <b>z = 2 + 3i</b>. Знайдіть arg(z) у радіанах, з точністю до 3 знаків після коми.",
    hint: "Кут тут не є 'табличним' значенням — знадобиться arctan(3/2) на калькуляторі.",
    expected: Math.atan2(3,2), tol: 0.003,
    display: "≈ 0.983",
    explain: "arg(z) = arctan(3/2) ≈ 0.9828 рад — приклад кута, що не виражається через прості дроби числа π."
  },
  {
    type: 'num',
    prompt: "z₁ = 4(cos40° + i·sin40°), z₂ = 5(cos25° + i·sin25°). Знайдіть |z₁·z₂|.",
    hint: "Модулі при множенні перемножуються.",
    expected: 20, tol: 0.01,
    display: "20",
    explain: "|z₁·z₂| = 4·5 = 20."
  },
  {
    type: 'num',
    prompt: "Для тих самих z₁, z₂ знайдіть arg(z₁·z₂) у градусах.",
    hint: "Аргументи при множенні додаються.",
    expected: 65, tol: 0.5,
    display: "65°",
    explain: "arg(z₁·z₂) = 40° + 25° = 65°."
  },
  {
    type: 'complex',
    prompt: "Обчисліть <b>(3 + 4i) / (1 − 2i)</b> і запишіть результат в алгебраїчній формі (наприклад: -1+2i).",
    hint: "Домножте чисельник і знаменник на число, спряжене до знаменника: (1+2i).",
    expectedRe: -1, expectedIm: 2, tol: 0.01,
    display: "−1 + 2i",
    explain: "(3+4i)(1+2i) / ((1−2i)(1+2i)) = (3+6i+4i+8i²)/5 = (3+10i−8)/5 = (−5+10i)/5 = −1+2i."
  },
  {
    type: 'text',
    prompt: "Яка фігура задається рівнянням <b>|z| = 9</b> на комплексній площині?",
    hint: "|z| — це відстань від точки z до початку координат.",
    accepted: ['коло'],
    display: "коло радіуса 9 з центром у початку координат",
    explain: "|z| = 9 означає, що відстань від z до точки 0 стала і дорівнює 9 — це геометричне означення кола."
  },
  {
    type: 'num',
    prompt: "Знайдіть головне значення arg[(cos50° + i·sin50°)⁷] у градусах (з проміжку (−180°, 180°]).",
    hint: "Спершу порахуйте 7·50°, а потім зведіть результат до потрібного проміжку, віднявши 360°.",
    expected: -10, tol: 0.5,
    display: "−10°",
    explain: "7·50° = 350°, що еквівалентно 350° − 360° = −10° у головному проміжку."
  },
  {
    type: 'num',
    prompt: "Знайдіть Re[e<sup>i·2π/3</sup>].",
    hint: "e<sup>iθ</sup> = cos θ + i·sin θ; тут θ = 2π/3 = 120°.",
    expected: -0.5, tol: 0.01,
    display: "−0.5",
    explain: "Re[e<sup>i·2π/3</sup>] = cos(120°) = −0.5."
  },
  {
    type: 'complex',
    placeholder: "a+bi",
    prompt: "Чому дорівнює <b>1/i</b> в алгебраїчній формі (a+bi)?",
    hint: "Домножте чисельник і знаменник на i: 1/i = i/i².",
    expectedRe: 0, expectedIm: -1, tol: 0.01,
    display: "−i (тобто 0 − i)",
    explain: "1/i = i/i² = i/(−1) = −i."
  },
  {
    type: 'num',
    prompt: "Запишіть 1/i у показниковій формі r·e<sup>iθ</sup>. Чому дорівнює θ у радіанах (з проміжку (−π, π])?",
    hint: "r тут дорівнює 1, а число −i лежить на від'ємній уявній півосі.",
    expected: -Math.PI/2, tol: 0.01,
    display: "−π/2",
    explain: "1/i = −i = 1·e<sup>−iπ/2</sup>, тобто θ = −π/2."
  },
  {
    type: 'num',
    prompt: "Дано <b>z = 10</b>. Чому дорівнює спряжене число z̄?",
    hint: "Дійсна частина не змінюється, а уявна частина у дійсного числа дорівнює нулю.",
    expected: 10, tol: 0.01,
    display: "10",
    explain: "Для будь-якого дійсного числа z̄ = z, оскільки уявна частина дорівнює 0, і міняти в ній знак нічого."
  },
  {
    type: 'set',
    prompt: "Знайдіть аргументи (у градусах) усіх 5 коренів рівняння <b>x⁵ = i</b>. Перелічіть через кому (порядок не важливий).",
    hint: "i = e<sup>i·90°</sup>. Корені: (90° + 360°k)/5 для k = 0, 1, 2, 3, 4.",
    expectedSet: [18, 90, 162, 234, 306], tol: 0.5,
    display: "18°, 90°, 162°, 234°, 306°",
    explain: "θ_k = (90° + 360°k)/5: при k=0..4 отримуємо 18°, 90°, 162°, 234°, 306° — усі корені мають модуль 1."
  },
  {
    type: 'num',
    prompt: "Дано <b>z = 2·e<sup>i·5π/6</sup></b>. Знайдіть Re(z) (можна з коренем, наприклад -sqrt(3)).",
    hint: "Re(z) = |z|·cos(arg z); 5π/6 = 150°.",
    expected: -Math.sqrt(3), tol: 0.02,
    display: "−√3 ≈ −1.732",
    explain: "Re(z) = 2·cos(150°) = 2·(−√3/2) = −√3."
  },
  {
    type: 'num',
    prompt: "Знайдіть суму аргументів (у градусах) усіх коренів рівняння <b>z² = −i</b>.",
    hint: "−i = e<sup>−i·90°</sup>. Корені: (−90° + 360°k)/2 для k = 0, 1. Порахуйте кожен аргумент окремо, а потім додайте їх.",
    expected: 90, tol: 0.5,
    display: "90°",
    explain: "Корені мають аргументи (−90°+360°·0)/2 = −45° і (−90°+360°·1)/2 = 135°. Сума: −45° + 135° = 90°."
  },
  {
    type: 'num',
    prompt: "Дано <b>z = 1 + i</b>. Знайдіть |z⁸|.",
    hint: "Спершу знайдіть |z|, а потім піднесіть результат до 8-го степеня.",
    expected: 16, tol: 0.01,
    display: "16",
    explain: "|z| = √2, тому |z⁸| = (√2)⁸ = 2⁴ = 16."
  },
  {
    type: 'num',
    prompt: "Для того самого z = 1 + i знайдіть головне значення arg(z⁸) у градусах (з проміжку (−180°, 180°]).",
    hint: "arg(z) = 45°; помножте на 8 і зведіть результат до потрібного проміжку.",
    expected: 0, tol: 0.5,
    display: "0°",
    explain: "8·45° = 360°, що еквівалентно повному оберту, тобто головне значення дорівнює 0°."
  },
  {
    type: 'set',
    prompt: "Знайдіть аргументи (у градусах) усіх коренів рівняння <b>x³ = −1</b>. Перелічіть через кому.",
    hint: "−1 = e<sup>i·180°</sup>. Корені: (180° + 360°k)/3 для k = 0, 1, 2.",
    expectedSet: [60, 180, 300], tol: 0.5,
    display: "60°, 180°, 300°",
    explain: "θ_k = (180° + 360°k)/3: при k=0,1,2 отримуємо 60°, 180°, 300°."
  }
];

const state = questions.map(() => ({ hintUsed: false, answered: false }));

function parseExpr(raw) {
  if (raw == null) return NaN;
  let s = raw.toLowerCase().trim();
  if (s === '') return NaN;
  s = s.replace(/,/g, '.').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/\s+/g, '');
  if (!/^[0-9+\-*/().pisqrt]+$/.test(s)) return NaN;
  s = s.replace(/pi/g, 'Math.PI').replace(/sqrt/g, 'Math.sqrt');
  try {
    const val = Function('"use strict";return (' + s + ')')();
    return (typeof val === 'number' && isFinite(val)) ? val : NaN;
  } catch (e) { return NaN; }
}

function parseComplexAnswer(raw) {
  if (raw == null) return null;
  let s = raw.toLowerCase().replace(/\s+/g, '').replace(/,/g, '.').replace(/−/g, '-');
  if (s === '') return null;
  if (s[0] !== '+' && s[0] !== '-') s = '+' + s;
  const terms = s.match(/[+-][^+-]+/g);
  if (!terms) return null;
  let re = 0, im = 0;
  for (const t of terms) {
    if (t.endsWith('i')) {
      let coef = t.slice(0, -1).replace(/\*$/, '');
      if (coef === '+' || coef === '') coef = '1';
      else if (coef === '-') coef = '-1';
      const val = parseExpr(coef.replace(/^\+/, ''));
      if (isNaN(val)) return null;
      im += val;
    } else {
      const val = parseExpr(t);
      if (isNaN(val)) return null;
      re += val;
    }
  }
  return { re, im };
}

function parseSetAnswer(raw) {
  if (raw == null) return null;
  const parts = raw.split(',').map(p => parseExpr(p));
  if (parts.some(v => isNaN(v))) return null;
  return parts;
}

const quizEl = document.getElementById('quiz');

function placeholderFor(q) {
  if (q.placeholder) return q.placeholder;
  if (q.type === 'complex') return 'напр. -1+2i';
  if (q.type === 'set') return 'напр. 10, 20, 30';
  if (q.type === 'text') return 'словом';
  return 'ваша відповідь';
}

function normalizeText(raw) {
  return (raw || '').toLowerCase().replace(/[\s'"()-]/g, '');
}

function render() {
  quizEl.innerHTML = questions.map((q, i) => `
    <div class="q" data-idx="${i}">
      <div class="q-num">Питання ${i+1} з ${questions.length}</div>
      <p class="q-prompt">${q.prompt}</p>
      <div class="answer-row">
        <input type="text" class="ans-input" data-idx="${i}" placeholder="${placeholderFor(q)}" autocomplete="off">
        <button class="hint-btn" data-idx="${i}">Показати підказку (−0.5 бала)</button>
      </div>
      <div class="hint-text" id="hint-${i}"></div>
    </div>
  `).join('');

  document.querySelectorAll('.ans-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = Number(inp.dataset.idx);
      state[idx].answered = inp.value.trim() !== '';
      updateProgress();
    });
  });

  document.querySelectorAll('.hint-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      if (state[idx].hintUsed) return;
      state[idx].hintUsed = true;
      const hintEl = document.getElementById('hint-' + idx);
      hintEl.textContent = questions[idx].hint;
      hintEl.classList.add('shown');
      btn.disabled = true;
      btn.textContent = 'Підказку використано (−0.5 бала)';
    });
  });

  updateProgress();
}

function updateProgress() {
  const answeredCount = state.filter(s => s.answered).length;
  document.getElementById('swProgressFill').style.width = (answeredCount / questions.length * 100) + '%';
}

/* stopwatch */
let startTime = null;
let elapsedFinal = null;
let timerInterval = null;
function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function tickTimer() {
  document.getElementById('timeDisplay').textContent = formatTime(Date.now() - startTime);
}

document.getElementById('startBtn').addEventListener('click', () => {
  startTime = Date.now();
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
  document.getElementById('quiz').classList.remove('locked');
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Тест триває…';
});

function fmtPts(p) {
  return Number.isInteger(p) ? String(p) : p.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
}

function submitQuiz() {
  if (startTime === null) return;
  clearInterval(timerInterval);
  elapsedFinal = Date.now() - startTime;

  let total = 0;
  const reviewHtml = questions.map((q, i) => {
    const input = document.querySelector(`.ans-input[data-idx="${i}"]`);
    const raw = input ? input.value.trim() : '';
    const hintFactor = state[i].hintUsed ? 0.5 : 1;
    let isCorrect = false, isPartial = false, points = 0;

    if (q.type === 'num') {
      const parsed = parseExpr(raw);
      isCorrect = !isNaN(parsed) && Math.abs(parsed - q.expected) <= q.tol;
      points = isCorrect ? hintFactor : 0;
    } else if (q.type === 'complex') {
      const parsed = parseComplexAnswer(raw);
      isCorrect = !!parsed && Math.abs(parsed.re - q.expectedRe) <= q.tol && Math.abs(parsed.im - q.expectedIm) <= q.tol;
      points = isCorrect ? hintFactor : 0;
    } else if (q.type === 'set') {
      const parsed = parseSetAnswer(raw);
      let matched = 0;
      if (parsed && parsed.length) {
        const used = new Array(parsed.length).fill(false);
        q.expectedSet.forEach(ev => {
          for (let k = 0; k < parsed.length; k++) {
            if (!used[k] && Math.abs(parsed[k] - ev) <= q.tol) { used[k] = true; matched++; break; }
          }
        });
      }
      const fraction = matched / q.expectedSet.length;
      isCorrect = fraction === 1;
      isPartial = fraction > 0 && fraction < 1;
      points = fraction * hintFactor;
    } else if (q.type === 'text') {
      const norm = normalizeText(raw);
      isCorrect = norm !== '' && q.accepted.some(k => norm.includes(normalizeText(k)));
      points = isCorrect ? hintFactor : 0;
    }
    total += points;

    const verdictClass = isCorrect ? 'correct' : (isPartial ? 'partial' : 'wrong');
    const verdictText = isCorrect ? 'вірно' : (isPartial ? 'частково' : 'невірно');

    return `
      <div class="review">
        <div class="review-head">
          <span>Питання ${i+1}</span>
          <span class="verdict ${verdictClass}">${verdictText} · ${fmtPts(points)} б.</span>
        </div>
        <p class="review-prompt">${q.prompt}</p>
        <p class="review-line"><span class="lbl">Ваша відповідь: </span><span class="your-ans ${verdictClass === 'wrong' ? 'wrong' : 'correct'}">${raw === '' ? '— не введено —' : raw}</span></p>
        <p class="review-line"><span class="lbl">Правильна відповідь: </span>${q.display}</p>
        <div class="review-explain">${q.explain}</div>
      </div>
    `;
  }).join('');

  document.getElementById('reviewList').innerHTML = reviewHtml;
  document.getElementById('scoreNum').innerHTML = `${fmtPts(total)}<span> / ${questions.length}</span>`;

  const hintsUsed = state.filter(s => s.hintUsed).length;
  document.getElementById('scoreNote').textContent = hintsUsed > 0
    ? `Використано підказок: ${hintsUsed} (кожна знімає 0.5 бала з відповідної правильної відповіді).`
    : `Підказки не використовувались.`;

  document.getElementById('finalTime').textContent = formatTime(elapsedFinal);

  document.getElementById('quiz').style.display = 'none';
  document.querySelector('.actions').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('retryBtn').addEventListener('click', () => location.reload());

render();
</script>
</body>
</html>
