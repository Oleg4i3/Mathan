<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз: комплексні числа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --panel-border: rgba(20,27,42,0.14);
    --grid: rgba(20,27,42,0.06);
    --ink: #171E2C;
    --dim: #5B6472;
    --gold: #93711A;
    --teal: #0E7C72;
    --good: #1F7A3D;
    --bad: #AE3A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0F1A;
      --panel: #111827;
      --panel-border: rgba(255,255,255,0.10);
      --grid: rgba(148,163,184,0.09);
      --ink: #E7EAF0;
      --dim: #8B95A8;
      --gold: #D9B84E;
      --teal: #5FD8CB;
      --good: #63C783;
      --bad: #E5766C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0F1A;
    --panel: #111827;
    --panel-border: rgba(255,255,255,0.10);
    --grid: rgba(148,163,184,0.09);
    --ink: #E7EAF0;
    --dim: #8B95A8;
    --gold: #D9B84E;
    --teal: #5FD8CB;
    --good: #63C783;
    --bad: #E5766C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    line-height: 1.5;
    min-height: 100vh;
    padding: 48px 20px 90px;
  }
  .page { max-width: 640px; margin: 0 auto; }

  /* floating stopwatch */
  #stopwatch {
    position: fixed;
    top: 18px;
    right: 18px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    padding: 8px 12px 10px;
    opacity: 0.6;
    z-index: 50;
    transition: opacity 0.15s ease;
    pointer-events: none;
    min-width: 96px;
  }
  #stopwatch:hover { opacity: 0.9; }
  #stopwatch .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--teal);
    border-radius: 50%;
    margin-right: 7px;
  }
  #stopwatch .sw-progress-track {
    height: 2px;
    background: var(--panel-border);
    margin-top: 7px;
  }
  #stopwatch .sw-progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  header { margin-bottom: 40px; }
  .plane { width: 76px; height: 76px; display: block; margin-bottom: 18px; }
  .plane line { stroke: var(--dim); stroke-width: 1; }
  .plane .vec { stroke: var(--teal); stroke-width: 2; }
  .plane .arc { stroke: var(--gold); stroke-width: 1.4; fill: none; }
  .plane circle { fill: var(--gold); }

  h1 {
    font-family: 'Spectral', Georgia, serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  .subtitle { color: var(--dim); font-size: 0.92rem; max-width: 48ch; margin: 0; }

  .progress-track { height: 3px; background: var(--panel-border); margin: 30px 0 0; }
  .progress-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.25s ease; }
  .progress-label { font-size: 0.78rem; color: var(--dim); margin: 8px 0 34px; }
  #startBtn {
    background: var(--teal);
    color: var(--bg);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 14px 22px;
    cursor: pointer;
    margin-top: 30px;
  }
  #startBtn:hover { filter: brightness(1.08); }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #quiz.locked { display: none; }

  .q { border-top: 1px solid var(--panel-border); padding: 26px 0; }
  .q:last-of-type { border-bottom: 1px solid var(--panel-border); }
  .q-num { font-size: 0.78rem; color: var(--dim); margin-bottom: 10px; }
  .q-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.12rem; margin: 0 0 16px; max-width: 58ch; }
  .q-prompt b { font-weight: 600; }

  .answer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .answer-row input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    padding: 10px 12px;
    width: 220px;
    max-width: 100%;
  }
  .answer-row input[type="text"]:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .hint-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    padding: 9px 12px;
    cursor: pointer;
  }
  .hint-btn:hover { border-color: var(--gold); }
  .hint-btn:disabled { cursor: default; opacity: 0.55; }

  .hint-text {
    display: none;
    margin-top: 12px;
    font-size: 0.86rem;
    color: var(--dim);
    border-left: 2px solid var(--gold);
    padding-left: 12px;
  }
  .hint-text.shown { display: block; }

  .actions { margin-top: 46px; display: flex; justify-content: flex-start; }
  #submitBtn, #retryBtn {
    background: var(--teal);
    color: var(--bg);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 14px 22px;
    cursor: pointer;
  }
  #submitBtn:hover, #retryBtn:hover { filter: brightness(1.08); }

  #results { display: none; }
  .score-block {
    border-top: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 28px 0;
    margin: 40px 0 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }
  .score-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 2.6rem; }
  .score-num span { color: var(--dim); font-size: 1.4rem; }
  .time-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 1.6rem; text-align: right; }
  .time-lbl, .score-note { color: var(--dim); font-size: 0.8rem; }

  .review { border-top: 1px solid var(--panel-border); padding: 20px 0; }
  .review:last-child { border-bottom: 1px solid var(--panel-border); }
  .review-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 0.78rem; color: var(--dim); }
  .verdict { font-weight: 600; }
  .verdict.correct { color: var(--good); }
  .verdict.wrong { color: var(--bad); }
  .verdict.partial { color: var(--gold); }
  .review-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.03rem; margin: 10px 0 12px; }
  .review-line { font-size: 0.88rem; margin: 4px 0; }
  .review-line .lbl { color: var(--dim); }
  .your-ans.wrong { color: var(--bad); }
  .your-ans.correct { color: var(--good); }
  .review-explain { margin-top: 10px; font-size: 0.86rem; color: var(--dim); padding: 10px 12px; background: var(--panel); border: 1px solid var(--panel-border); }

  @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
</style>
</head>
<body>

<div id="stopwatch"><span class="dot"></span><span id="timeDisplay">00:00</span><div class="sw-progress-track"><div class="sw-progress-fill" id="swProgressFill"></div></div></div>

<div class="page">

  <header>
    <svg class="plane" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
      <line x1="6" y1="66" x2="70" y2="66"></line>
      <line x1="10" y1="70" x2="10" y2="6"></line>
      <path class="arc" d="M 30 66 A 20 20 0 0 0 24.1 51.9"></path>
      <line class="vec" x1="10" y1="66" x2="46" y2="30"></line>
      <circle cx="46" cy="30" r="2.6"></circle>
    </svg>
    <h1>Комплексні числа</h1>
    <p class="subtitle">Задачі: модуль, аргумент, добуток, частка, степінь, форми запису та корені комплексних рівнянь (у т.ч. за формулою Муавра). Числа в умовах генеруються випадково — кожна спроба відрізняється.</p>
    <button id="startBtn">Старт</button>
  </header>

  <div id="quiz" class="locked"></div>

  <div class="actions"><button id="submitBtn">Завершити тест</button></div>

  <div id="results">
    <div class="score-block">
      <div>
        <div class="score-num" id="scoreNum">0<span> / 20</span></div>
        <p class="score-note" id="scoreNote"></p>
      </div>
      <div>
        <div class="time-num" id="finalTime">00:00</div>
        <p class="time-lbl">витрачений час</p>
      </div>
    </div>
    <div id="reviewList"></div>
    <div class="actions"><button id="retryBtn">Пройти ще раз</button></div>
  </div>

</div>

<script>
// ===== ГЕНЕРАТОРИ ЗАДАЧ (рандомізація в розумних межах; цілі відповіді лишаються цілими) =====
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function pick(arr){ return arr[rnd(0, arr.length - 1)]; }
function reduceAngle(t){ let r = t; while (r <= -180) r += 360; while (r > 180) r -= 360; return r; }
function signNum(v){ return v < 0 ? '−' + Math.abs(v) : String(v); }
function fmtComplexInt(a, b){ return `${signNum(a)} ${b < 0 ? '−' : '+'} ${Math.abs(b)}i`; }
function surdTerm(k, surd){ if (!surd) return String(k); return k === 1 ? '√3' : `${k}√3`; }
function surd2Term(k){ return k === 1 ? '√2' : `${k}√2`; }
const SUP = {2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};

// ---- таблиця "діагональних" напрямків (для алгебраїчних z = k·(...), масштабованих цілим k) ----
const ANGLES12 = [
  {angle:45,  reC:1,reSurd:false,reSign:1, imC:1,imSurd:false,imSign:1, fam:'r2'},
  {angle:135, reC:1,reSurd:false,reSign:-1,imC:1,imSurd:false,imSign:1, fam:'r2'},
  {angle:-45, reC:1,reSurd:false,reSign:1, imC:1,imSurd:false,imSign:-1,fam:'r2'},
  {angle:-135,reC:1,reSurd:false,reSign:-1,imC:1,imSurd:false,imSign:-1,fam:'r2'},
  {angle:30,  reC:1,reSurd:true, reSign:1, imC:1,imSurd:false,imSign:1, fam:'std'},
  {angle:150, reC:1,reSurd:true, reSign:-1,imC:1,imSurd:false,imSign:1, fam:'std'},
  {angle:-30, reC:1,reSurd:true, reSign:1, imC:1,imSurd:false,imSign:-1,fam:'std'},
  {angle:-150,reC:1,reSurd:true, reSign:-1,imC:1,imSurd:false,imSign:-1,fam:'std'},
  {angle:60,  reC:1,reSurd:false,reSign:1, imC:1,imSurd:true, imSign:1, fam:'std'},
  {angle:120, reC:1,reSurd:false,reSign:-1,imC:1,imSurd:true, imSign:1, fam:'std'},
  {angle:-60, reC:1,reSurd:false,reSign:1, imC:1,imSurd:true, imSign:-1,fam:'std'},
  {angle:-120,reC:1,reSurd:false,reSign:-1,imC:1,imSurd:true, imSign:-1,fam:'std'},
];
const AXIS4 = [
  {angle:0,  reC:1,reSurd:false,reSign:1,imC:0,imSurd:false,imSign:1, fam:'axis'},
  {angle:90, reC:0,reSurd:false,reSign:1,imC:1,imSurd:false,imSign:1, fam:'axis'},
  {angle:180,reC:1,reSurd:false,reSign:-1,imC:0,imSurd:false,imSign:1,fam:'axis'},
  {angle:-90,reC:0,reSurd:false,reSign:1,imC:1,imSurd:false,imSign:-1,fam:'axis'},
];
function algebraicStr(e, k){
  let s = '';
  if (e.reC !== 0) { s += (e.reSign < 0 ? '-' : '') + surdTerm(k, e.reSurd); }
  if (e.imC !== 0) {
    let mag = surdTerm(k, e.imSurd);
    if (mag === '1') mag = '';
    if (s === '') { s = (e.imSign < 0 ? '-' : '') + mag + 'i'; }
    else { s += (e.imSign < 0 ? '-' : '+') + mag + 'i'; }
  }
  return s || '0';
}

// ---- таблиця точок одиничного кола (для Re[e^{iθ}] і 1/z типу задач) ----
const UNIT16 = [
 {angle:0,   reStr:'1',     imStr:'0',    reNum:1,              imNum:0},
 {angle:30,  reStr:'√3/2',  imStr:'1/2',  reNum:Math.sqrt(3)/2, imNum:0.5},
 {angle:45,  reStr:'√2/2',  imStr:'√2/2', reNum:Math.SQRT2/2,   imNum:Math.SQRT2/2},
 {angle:60,  reStr:'1/2',   imStr:'√3/2', reNum:0.5,            imNum:Math.sqrt(3)/2},
 {angle:90,  reStr:'0',     imStr:'1',    reNum:0,              imNum:1},
 {angle:120, reStr:'-1/2',  imStr:'√3/2', reNum:-0.5,           imNum:Math.sqrt(3)/2},
 {angle:135, reStr:'-√2/2', imStr:'√2/2', reNum:-Math.SQRT2/2,  imNum:Math.SQRT2/2},
 {angle:150, reStr:'-√3/2', imStr:'1/2',  reNum:-Math.sqrt(3)/2,imNum:0.5},
 {angle:180, reStr:'-1',    imStr:'0',    reNum:-1,             imNum:0},
 {angle:-30, reStr:'√3/2',  imStr:'-1/2', reNum:Math.sqrt(3)/2, imNum:-0.5},
 {angle:-45, reStr:'√2/2',  imStr:'-√2/2',reNum:Math.SQRT2/2,   imNum:-Math.SQRT2/2},
 {angle:-60, reStr:'1/2',   imStr:'-√3/2',reNum:0.5,            imNum:-Math.sqrt(3)/2},
 {angle:-90, reStr:'0',     imStr:'-1',   reNum:0,              imNum:-1},
 {angle:-120,reStr:'-1/2',  imStr:'-√3/2',reNum:-0.5,           imNum:-Math.sqrt(3)/2},
 {angle:-135,reStr:'-√2/2', imStr:'-√2/2',reNum:-Math.SQRT2/2,  imNum:-Math.SQRT2/2},
 {angle:-150,reStr:'-√3/2', imStr:'-1/2', reNum:-Math.sqrt(3)/2,imNum:-0.5},
];
const PI_FRAC = {0:'0',30:'π/6',45:'π/4',60:'π/3',90:'π/2',120:'2π/3',135:'3π/4',150:'5π/6',180:'π',
  '-30':'−π/6','-45':'−π/4','-60':'−π/3','-90':'−π/2','-120':'−2π/3','-135':'−3π/4','-150':'−5π/6'};
function unitAlgStr(e){
  let s = '';
  if (e.reStr !== '0') s += e.reStr;
  if (e.imStr !== '0') {
    const neg = e.imStr.startsWith('-');
    let mag = neg ? e.imStr.slice(1) : e.imStr;
    if (mag === '1') mag = '';
    else if (mag.includes('/')) mag = `(${mag})`;
    if (s === '') s = (neg ? '-' : '') + mag + 'i';
    else s += (neg ? '-' : '+') + mag + 'i';
  }
  return s || '0';
}
function scaleFracStr(fracStr, M){
  if (fracStr === '0') return '0';
  const neg = fracStr.startsWith('-');
  const body = neg ? fracStr.slice(1) : fracStr;
  let out;
  if (!body.includes('/')) { out = M * (neg ? -1 : 1); return String(out); }
  const [num, den] = body.split('/');
  const half = M / Number(den);
  const magStr = num === '1' ? String(half) : (half === 1 ? num : `${half}${num}`);
  return (neg ? '-' : '') + magStr;
}
function axisDesc(angle){
  return { 0:'додатній дійсній півосі', 180:"від'ємній дійсній півосі", 90:'додатній уявній півосі', '-90':"від'ємній уявній півосі" }[angle];
}

// 1) |z̄| через піфагорову трійку
const PYTHAG = [[3,4,5],[6,8,10],[5,12,13],[8,15,17],[7,24,25],[9,12,15],[20,21,29],[12,16,20],[9,40,41],[10,24,26],[12,35,37],[15,20,25]];
function genPythagZ(excludeIdx){
  let idx; do { idx = rnd(0, PYTHAG.length - 1); } while (idx === excludeIdx);
  const t = PYTHAG[idx];
  const swap = pick([true, false]);
  const legA = swap ? t[1] : t[0], legB = swap ? t[0] : t[1];
  const a = legA * pick([1,-1]), b = legB * pick([1,-1]);
  return { idx, a, b, c: t[2] };
}
function genQ1(){
  const z = genPythagZ(-1);
  return {
    type:'num',
    prompt: `Дано <b>z = ${fmtComplexInt(z.a,z.b)}</b>. Знайдіть модуль спряженого числа z̄, тобто |z̄|.`,
    hint: "z̄ відрізняється лише знаком уявної частини; це не впливає на суму квадратів дійсної та уявної частин.",
    expected: z.c, tol: 0.01,
    display: String(z.c),
    explain: `z̄ = ${fmtComplexInt(z.a,-z.b)}, і |z̄| = √(${Math.abs(z.a)}²+${Math.abs(z.b)}²) = √${z.a*z.a+z.b*z.b} = ${z.c} — той самий модуль, що й у z, оскільки |z̄| = |z| завжди.`,
    _excludeIdx: z.idx
  };
}
function genQ2(excludeIdx){
  const z = genPythagZ(excludeIdx);
  return {
    type:'num',
    prompt: `Дано <b>z = ${fmtComplexInt(z.a,z.b)}</b>. Знайдіть |z|.`,
    hint: `${Math.abs(z.a)}, ${Math.abs(z.b)}, ${z.c} — піфагорова трійка.`,
    expected: z.c, tol: 0.01,
    display: String(z.c),
    explain: `|z| = √(${Math.abs(z.a)}²+${Math.abs(z.b)}²) = √${z.a*z.a+z.b*z.b} = ${z.c}.`
  };
}

// 3) arg(z) для "табличного" кута
function genQ3(){
  const e = pick(ANGLES12), k = rnd(1,3);
  const zStr = algebraicStr(e,k);
  return {
    type:'num',
    prompt: `Дано <b>z = ${zStr}</b>. Знайдіть arg(z) у градусах (з проміжку (−180°, 180°]).`,
    hint: `Зобразіть z на комплексній площині й визначте, під яким табличним кутом до дійсної осі лежить вектор.`,
    expected: e.angle, tol: 0.5,
    display: `${e.angle}°`,
    explain: `Дійсна й уявна частини z відповідають табличним значенням cos і sin, звідки arg(z) = ${e.angle}°.`
  };
}

// 4) концептуальне питання — параметрів для рандомізації немає, лишаємо без змін
function genQ4(){
  return {
    type:'num',
    prompt: "Комплексне число z дорівнює своєму спряженому, z = z̄. Чому дорівнює <b>додатний</b> (тобто більший за нуль) аргумент такого числа, у градусах?",
    hint: "З рівності z = z̄ випливає, що z — дійсне число. У дійсного числа можливі лише два значення аргументу: 0° або 180°.",
    expected: 180, tol: 0.5,
    display: "180°",
    explain: "z = z̄ означає, що уявна частина z дорівнює нулю, тобто z — дійсне число. Аргумент дійсного додатного числа дорівнює 0°, а від'ємного — 180°. Оскільки 0° не є додатним значенням, єдиний можливий додатний аргумент — 180° (він відповідає від'ємним дійсним числам)."
  };
}

// 5) arg у градусах, не табличний кут (наближено, із заданою точністю)
function genQ5(){
  let a,b; do { a = rnd(2,9); b = rnd(2,9); } while (a === b);
  const val = Math.atan2(b,a) * 180/Math.PI;
  return {
    type:'num',
    prompt: `Дано <b>z = ${a} + ${b}i</b>. Знайдіть arg(z) у градусах, з точністю до 2 знаків після коми.`,
    hint: `Кут тут не є 'табличним' значенням — знадобиться arctan(${b}/${a}) на калькуляторі (результат переведіть у градуси).`,
    expected: val, tol: 0.05,
    display: `≈ ${val.toFixed(2)}°`,
    explain: `arg(z) = arctan(${b}/${a}) ≈ ${val.toFixed(3)}° — приклад кута, що не є табличним значенням.`
  };

function parseExpr(raw) {
  if (raw == null) return NaN;
  let s = raw.toLowerCase().trim();
  if (s === '') return NaN;
  s = s.replace(/,/g, '.').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/\s+/g, '');
  if (!/^[0-9+\-*/().pisqrt]+$/.test(s)) return NaN;
  s = s.replace(/pi/g, 'Math.PI').replace(/sqrt/g, 'Math.sqrt');
  try {
    const val = Function('"use strict";return (' + s + ')')();
    return (typeof val === 'number' && isFinite(val)) ? val : NaN;
  } catch (e) { return NaN; }
}

function parseComplexAnswer(raw) {
  if (raw == null) return null;
  let s = raw.toLowerCase().replace(/\s+/g, '').replace(/,/g, '.').replace(/−/g, '-');
  if (s === '') return null;
  if (s[0] !== '+' && s[0] !== '-') s = '+' + s;
  const terms = s.match(/[+-][^+-]+/g);
  if (!terms) return null;
  let re = 0, im = 0;
  for (const t of terms) {
    if (t.endsWith('i')) {
      let coef = t.slice(0, -1).replace(/\*$/, '');
      if (coef === '+' || coef === '') coef = '1';
      else if (coef === '-') coef = '-1';
      const val = parseExpr(coef.replace(/^\+/, ''));
      if (isNaN(val)) return null;
      im += val;
    } else {
      const val = parseExpr(t);
      if (isNaN(val)) return null;
      re += val;
    }
  }
  return { re, im };
}

function parseSetAnswer(raw) {
  if (raw == null) return null;
  const parts = raw.split(',').map(p => parseExpr(p));
  if (parts.some(v => isNaN(v))) return null;
  return parts;
}

const quizEl = document.getElementById('quiz');

function placeholderFor(q) {
  if (q.placeholder) return q.placeholder;
  if (q.type === 'complex') return 'напр. -1+2i';
  if (q.type === 'set') return 'напр. 10, 20, 30';
  if (q.type === 'text') return 'словом';
  return 'ваша відповідь';
}

function normalizeText(raw) {
  return (raw || '').toLowerCase().replace(/[\s'"()-]/g, '');
}

/* stopwatch */
let startTime = null;
let elapsedFinal = null;
let timerInterval = null;
function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function tickTimer() {
  document.getElementById('timeDisplay').textContent = formatTime(Date.now() - startTime);
}

document.getElementById('startBtn').addEventListener('click', () => {
  startTime = Date.now();
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
  document.getElementById('quiz').classList.remove('locked');
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Тест триває…';
});

function fmtPts(p) {
  return Number.isInteger(p) ? String(p) : p.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
}

function submitQuiz() {
  if (startTime === null) return;
  clearInterval(timerInterval);
  elapsedFinal = Date.now() - startTime;

  let total = 0;
  const reviewHtml = questions.map((q, i) => {
    const input = document.querySelector(`.ans-input[data-idx="${i}"]`);
    const raw = input ? input.value.trim() : '';
    const hintFactor = state[i].hintUsed ? 0.5 : 1;
    let isCorrect = false, isPartial = false, points = 0;

    if (q.type === 'num') {
      const parsed = parseExpr(raw);
      isCorrect = !isNaN(parsed) && Math.abs(parsed - q.expected) <= q.tol;
      points = isCorrect ? hintFactor : 0;
    } else if (q.type === 'complex') {
      const parsed = parseComplexAnswer(raw);
      isCorrect = !!parsed && Math.abs(parsed.re - q.expectedRe) <= q.tol && Math.abs(parsed.im - q.expectedIm) <= q.tol;
      points = isCorrect ? hintFactor : 0;
    } else if (q.type === 'set') {
      const parsed = parseSetAnswer(raw);
      let matched = 0;
      if (parsed && parsed.length) {
        const used = new Array(parsed.length).fill(false);
        q.expectedSet.forEach(ev => {
          for (let k = 0; k < parsed.length; k++) {
            if (!used[k] && Math.abs(parsed[k] - ev) <= q.tol) { used[k] = true; matched++; break; }
          }
        });
      }
      const fraction = matched / q.expectedSet.length;
      isCorrect = fraction === 1;
      isPartial = fraction > 0 && fraction < 1;
      points = fraction * hintFactor;
    } else if (q.type === 'text') {
      const norm = normalizeText(raw);
      isCorrect = norm !== '' && q.accepted.some(k => norm.includes(normalizeText(k)));
      points = isCorrect ? hintFactor : 0;
    }
    total += points;

    const verdictClass = isCorrect ? 'correct' : (isPartial ? 'partial' : 'wrong');
    const verdictText = isCorrect ? 'вірно' : (isPartial ? 'частково' : 'невірно');

    return `
      <div class="review">
        <div class="review-head">
          <span>Питання ${i+1}</span>
          <span class="verdict ${verdictClass}">${verdictText} · ${fmtPts(points)} б.</span>
        </div>
        <p class="review-prompt">${q.prompt}</p>
        <p class="review-line"><span class="lbl">Ваша відповідь: </span><span class="your-ans ${verdictClass === 'wrong' ? 'wrong' : 'correct'}">${raw === '' ? '— не введено —' : raw}</span></p>
        <p class="review-line"><span class="lbl">Правильна відповідь: </span>${q.display}</p>
        <div class="review-explain">${q.explain}</div>
      </div>
    `;
  }).join('');

  document.getElementById('reviewList').innerHTML = reviewHtml;
  document.getElementById('scoreNum').innerHTML = `${fmtPts(total)}<span> / ${questions.length}</span>`;

  const hintsUsed = state.filter(s => s.hintUsed).length;
  document.getElementById('scoreNote').textContent = hintsUsed > 0
    ? `Використано підказок: ${hintsUsed} (кожна знімає 0.5 бала з відповідної правильної відповіді).`
    : `Підказки не використовувались.`;

  document.getElementById('finalTime').textContent = formatTime(elapsedFinal);

  document.getElementById('quiz').style.display = 'none';
  document.querySelector('.actions').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('retryBtn').addEventListener('click', () => location.reload());

render();
</script>
</body>
</html>
